<h1 style="text-align:center;">📱 Samsung iPhone Calculator</h1>

<div style="border: 2px solid black; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto;">

<p>Bei ya Simu (TZS):</p>
<input type="number" id="beiSimu" value="1500000" style="width: 95%; padding: 10px;">

<p>Downpayment Ulicho nacho (TZS):</p>
<input type="number" id="down" placeholder="mf: 300000" style="width: 95%; padding: 10px;">

<p>Miezi ya kulipa (6 au 12):</p>
<input type="number" id="miezi" value="12" style="width: 95%; padding: 10px;">

<br><br>
<button onclick="kokotoa()" style="width: 100%; background: black; color: white; padding: 15px; border-radius: 10px; font-size: 18px;">KOKOTOA</button>

<h2 id="baki" style="color: red;"></h2>
<h2 id="mwezi" style="color: green;"></h2>

<a id="waLink" href="#" style="display:none; background: green; color: white; padding: 12px; text-decoration: none; border-radius: 10px; display: none; text-align: center;">Tuma WhatsApp kwa Samsung</a>

</div>

<script>
function kokotoa() {
  let bei = Number(document.getElementById("beiSimu").value);
  let down = Number(document.getElementById("down").value);
  let miezi = Number(document.getElementById("miezi").value);
  
  let baki = bei - down;
  let kwaMwezi = baki / miezi;
  
  document.getElementById("baki").innerHTML = "Baki kulipa: " + baki + " TZS";
  document.getElementById("mwezi").innerHTML = "Kwa mwezi: " + Math.round(kwaMwezi) + " TZS kwa miezi " + miezi;
  
  let ujumbe = "Habari, nataka simu ya " + bei + ". Nina downpayment " + down + " naomba kulipa " + Math.round(kwaMwezi) + " kwa mwezi.";
  let link = document.getElementById("waLink");
  link.href = "https://wa.me/255710240894?text=" + encodeURIComponent(ujumbe);
  link.style.display = "block";
}
</script>
