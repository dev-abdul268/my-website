<h1>Calculator ya Punguzo</h1>

<p>Andika bei ya kawaida:</p>
<input type="number" id="beiKawaida" placeholder="mf: 15000" style="padding: 10px;">

<button onclick="pigaHesabu()" style="background: blue; color: white; padding: 10px; margin-top: 10px;">Piga Hesabu</button>

<h2 id="matokeo" style="color: green;"></h2>

<script>
function pigaHesabu() {
  let bei = document.getElementById("beiKawaida").value;
  let punguzo = bei * 0.2; // punguzo 20%
  let beiMpya = bei - punguzo;
  
  document.getElementById("matokeo").innerHTML = "Bei mpya ni: " + beiMpya + " TZS. Umeokoa " + punguzo + "!";
}
</script>
