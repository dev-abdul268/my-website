  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#070707;color:#fff;font-family:'Inter',sans-serif;padding-bottom:120px}
  .wrap{max-width:600px;margin:0 auto}
  .hero{padding:36px 20px 10px}
  .top{font-family:'Syne';font-size:11px;letter-spacing:3px;opacity:.5;display:flex;justify-content:space-between}

  .profile{width:100%;height:520px;border-radius:28px;object-fit:cover;display:block}

  .card p{color:#666;font-size:12px;margin-top:4px}
  .price{background:#fff;color:#000;padding:8px 14px;border-radius:100px;font-weight:800;font-size:14px}
  .cta{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:560px;background:#fff;color:#000;text-align:center;padding:19px;border-radius:100px;font-family:'Syne';font-weight:800;text-decoration:none;font-size:16px}
  .footer{text-align:center;color:#333;font-size:11px;margin-top:40px;letter-spacing:2px;font-family:'Syne'}
</style>
</head>
<body>
<div class="wrap">
