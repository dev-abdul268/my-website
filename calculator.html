<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Duka la Abdul</title>
<style>
body{margin:0; font-family:-apple-system, sans-serif; background:#f5f5f7;}
.top{background:black; color:white; padding:20px; text-align:center;}
.top h1{margin:0; font-size:24px;}
.card{max-width:390px; margin:-20px auto 20px; background:white; border-radius:30px 30px 0 0; padding:25px; min-height:100vh;}
.phone-img{width:100%; height:220px; background:linear-gradient(135deg,#667eea,#764ba2); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:80px;}
label{font-weight:600; margin-top:15px; display:block; font-size:14px;}
select,input{width:100%; padding:15px; border-radius:12px; border:1.5px solid #ddd; margin-top:6px; font-size:16px; background:#f9f9f9; box-sizing:border-box;}
.btn-black{width:100%; background:black; color:white; padding:18px; border-radius:14px; border:none; font-weight:bold; font-size:17px; margin-top:20px;}
#result{display:none; margin-top:20px; padding:18px; background:#f0fff4; border-radius:16px; border:1px solid #c6f6d5;}
</style>
</head>
<body>
<div class="top"><h1>DUKA LA ABDUL 📱</h1><p style="opacity:0.7; margin:5px 0 20px;">Malipo Kidogo Kidogo</p></div>
<div class="card">
<div id="imgBox" class="phone-img">📱</div>

<label>Chagua Simu</label>
<select id="simu" onchange="badili()">
<option value="1500000">Samsung S24 - 1.5M TZS</option>
<option value="3200000">iPhone X / 11 - 3.2M TZS</option>
<option value="450000">Tecno Camon 20 - 450K TZS</option>
<option value="890000">Redmi Note 12 - 890K TZS</option>
<option value="2100000">iPhone 14 - 2.1M TZS</option>
</select>

<label>Downpayment yako (TZS)</label>
<input type="number" id="down" placeholder="300000" inputmode="numeric">

<label>Lipa kwa Miezi</label>
<select id="miezi">
<option value="6">Miezi 6 + 5% Riba</option>
<option value="12" selected>Miezi 12 + 10% Riba</option>
<option value="18">Miezi 18 +15% Riba</option>
</select>

<button class="btn-black" onclick="kokotoa()">ONA MALIPO YANGU →</button>

<div id="result">
<p id="bakiTxt" style="margin:5px 0;"></p>
<p id="ribaTxt" style="margin:5px 0; color:#e53e3e; font-size:13px;"></p>
<h2 id="mweziTxt" style="margin:10px 0; color:#000;"></h2>
<a id="waLink" href="#" style="display:block; background:#25D366; color:white; text-align:center; padding:16px; border-radius:12px; text-decoration:none; font-weight:bold; margin-top:12px;">Tuma WhatsApp 💬</a>
</div>

<p style="text-align:center; color:#aaa; font-size:12px; margin-top:30px;">Made with ❤️ by Developer_Abdul </p>
</div>

<script>
function badili(){
 let v = document.getElementById("simu").value;
 let box = document.getElementById("imgBox");
 if(v=="1500000") box.innerHTML="S24";
 else if(v=="3200000") box.innerHTML="X";
 else if(v=="450000") box.innerHTML="TECNO";
 else box.innerHTML="📱";
}
function kokotoa(){
 let bei = Number(document.getElementById("simu").value);
 let down = Number(document.getElementById("down").value);
 let miezi = Number(document.getElementById("miezi").value);
 let jina = document.getElementById("simu").options[document.getElementById("simu").selectedIndex].text;
 if(!down || down>=bei){ alert("Weka downpayment sahihi!"); return; }
 let baki = bei-down;
 let rP = miezi==6?0.05:miezi==12?0.10:0.15;
 let riba = baki*rP;
 let jumla = baki+riba;
 let mwezi = jumla/miezi;
 document.getElementById("result").style.display="block";
 document.getElementById("bakiTxt").innerHTML="Baki: <b>"+baki.toLocaleString()+" TZS</b>";
 document.getElementById("ribaTxt").innerHTML="Riba "+(rP*100)+"%: "+Math.round(riba).toLocaleString()+" TZS";
 document.getElementById("mweziTxt").innerHTML=Math.round(mwezi).toLocaleString()+" TZS / mwezi";
 let msg = "Habari Abdul, nataka "+jina+". Downpayment "+down.toLocaleString()+". Lipa "+Math.round(mwezi).toLocaleString()+" kwa miezi "+miezi;
 document.getElementById("waLink").href="https://wa.me/255749485488?text="+encodeURIComponent(msg);
}
</script>
</body>
</html>
